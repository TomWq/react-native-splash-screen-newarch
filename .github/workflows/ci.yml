name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test and Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install package dependencies
        run: npm install
      - name: Run package tests
        run: npm test
      - name: Install example dependencies
        working-directory: example
        run: npm install
      - name: Run example tests
        working-directory: example
        run: npm test -- --runInBand
      - name: Run Android lifecycle tests
        working-directory: example/android
        run: >-
          ./gradlew :app:testDebugUnitTest
          -PreactNativeArchitectures=x86_64
      - name: Check package contents
        run: npm run pack:dry-run

  android-compatibility:
    name: Android RN ${{ matrix.react_native }} (${{ matrix.architecture_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react_native: 0.76.9
            cli: 15.1.3
            new_arch: false
            architecture_name: Legacy Architecture
          - react_native: 0.76.9
            cli: 15.1.3
            new_arch: true
            architecture_name: New Architecture
          - react_native: latest
            cli: latest
            new_arch: true
            architecture_name: New Architecture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build package
        run: |
          npm install
          npm run build
          package_file=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          echo "RNSS_PACKAGE=$RUNNER_TEMP/$package_file" >> "$GITHUB_ENV"
      - name: Create React Native compatibility app
        run: >-
          npx --yes @react-native-community/cli@${{ matrix.cli }} init RnssCompatibility
          --version ${{ matrix.react_native }}
          --directory "$RUNNER_TEMP/rnss-compatibility"
          --pm npm
          --install-pods false
          --skip-git-init
      - name: Install package in compatibility app
        working-directory: ${{ runner.temp }}/rnss-compatibility
        run: npm install "$RNSS_PACKAGE"
      - name: Build Android compatibility app
        working-directory: ${{ runner.temp }}/rnss-compatibility/android
        run: >-
          ./gradlew :app:assembleDebug
          -PnewArchEnabled=${{ matrix.new_arch }}
          -PreactNativeArchitectures=x86_64

  ios-example:
    name: iOS Example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: latest
          bundler-cache: true
          working-directory: example
      - name: Build package
        run: |
          npm install
          npm run build
      - name: Install example dependencies
        working-directory: example
        run: npm install
      - name: Install iOS pods
        working-directory: example/ios
        run: bundle exec pod install
      - name: Build iOS release example
        working-directory: example/ios
        run: >-
          xcodebuild
          -workspace examples.xcworkspace
          -scheme examples
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ios-derived-data"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run iOS cold-start smoke test
        shell: bash
        run: |
          set -euo pipefail

          device_id=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            device = devices.find do |item|
              item["isAvailable"] && item.fetch("name", "").start_with?("iPhone")
            end
            abort "No available iPhone Simulator found" unless device
            print device.fetch("udid")
          ')

          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install \
            "$device_id" \
            "$RUNNER_TEMP/ios-derived-data/Build/Products/Release-iphonesimulator/examples.app"

          launch_output=$(xcrun simctl launch \
            --terminate-running-process \
            "$device_id" \
            com.examples)
          app_pid=${launch_output##*: }

          if [[ ! "$app_pid" =~ ^[0-9]+$ ]]; then
            echo "Unable to read the launched app PID from: $launch_output" >&2
            exit 1
          fi

          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            xcrun simctl spawn "$device_id" log show \
              --last 1m \
              --predicate 'process == "examples"' || true
            echo "iOS example exited during cold start" >&2
            exit 1
          fi

          xcrun simctl terminate "$device_id" com.examples

  expo-prebuild:
    name: Expo Prebuild and Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build package
        run: |
          npm install
          npm run build
      - name: Install Expo example dependencies
        working-directory: expo-example
        run: npm install
      - name: Generate native projects
        working-directory: expo-example
        env:
          CI: 1
        run: npx expo prebuild --clean --no-install
      - name: Check generated native integration
        run: node scripts/check-expo-prebuild.js expo-example
      - name: Build Expo Android project
        working-directory: expo-example/android
        run: >-
          ./gradlew :app:assembleDebug
          -PreactNativeArchitectures=x86_64
